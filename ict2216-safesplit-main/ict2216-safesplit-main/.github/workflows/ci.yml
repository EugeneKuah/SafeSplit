name: CI - Automated Testing

# Lab X07: unit tests run on every push/PR; the Selenium integration/UI job
# only runs after unit tests pass, against the full docker-compose stack.
# Scoped to Development only, since that's the active integration branch -
# main only receives stable snapshots/submission milestones (see README).
on:
  push:
    branches: [Development]
  pull_request:
    branches: [Development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # backend/package.json's "test" script loads ../.env (i.e. the repo
      # root .env). None of the current unit tests touch a live database,
      # so these values only need to be well-formed, not real.
      - name: Write dummy environment for unit tests
        run: |
          cat > .env <<EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=safesplit_test
          DB_USER=safesplit_test
          DB_PASSWORD=safesplit_test
          JWT_SECRET=ci_unit_test_secret_at_least_32_characters_long
          FRONTEND_URL=http://localhost
          NODE_ENV=test
          EOF

      - name: Run backend unit tests
        working-directory: backend
        run: npm test

  integration-tests:
    name: Selenium integration and UI tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Real values this time: the full stack actually boots and needs to
      # talk to a real Postgres and sign real JWTs. TLS_HOST must be an
      # IPv4 address (enforced by scripts/generate-selfsigned-cert.sh) but
      # its value doesn't otherwise matter - see the FRONTEND_URL note
      # below. FRONTEND_URL is set to the Selenium container's view of the
      # app (the "nginx" Compose service name), not 127.0.0.1, because the
      # backend's CORS check compares it against the browser's Origin
      # header, and Chrome runs inside the Selenium container on the
      # shared "safesplit-network" - see docker-compose.ci.yml.
      - name: Write environment for the running stack
        run: |
          cat > .env <<EOF
          DB_NAME=safesplit
          DB_USER=safesplit_user
          DB_PASSWORD=${{ secrets.CI_DB_PASSWORD || 'ci_only_password_not_secret' }}
          JWT_SECRET=${{ secrets.CI_JWT_SECRET || 'ci_only_jwt_secret_at_least_32_characters_long' }}
          TLS_HOST=127.0.0.1
          FRONTEND_URL=https://nginx
          NODE_ENV=production
          EOF

      - name: Generate self-signed certificate
        run: |
          chmod +x scripts/generate-selfsigned-cert.sh
          ./scripts/generate-selfsigned-cert.sh

      # docker-compose.ci.yml adds the Selenium/Chrome service on the same
      # network as the rest of the stack, so this single command brings
      # up nginx/frontend/backend/db *and* Selenium together.
      - name: Build and start the stack (including Selenium)
        run: docker compose -f compose.yaml -f docker-compose.ci.yml up -d --build

      - name: Wait for the app to become healthy
        run: |
          # This curl runs on the runner itself, so it goes through the
          # host-published port - correct even though the browser will
          # address the app differently (via the "nginx" service name).
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/api/health | grep -q 200; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose logs
          exit 1

      - name: Wait for Selenium to become ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:4444/wd/hub/status | grep -q '"ready": *true\|"ready":true'; then
              echo "Selenium is ready"
              exit 0
            fi
            echo "Waiting for Selenium... ($i)"
            sleep 2
          done
          echo "Selenium did not become ready in time"
          docker compose logs selenium
          exit 1

      - name: Install e2e test dependencies
        working-directory: tests/e2e
        run: npm install --no-audit --no-fund

      - name: Run Selenium integration/UI tests
        working-directory: tests/e2e
        env:
          BASE_URL: https://nginx
          SELENIUM_URL: http://localhost:4444/wd/hub
          HEALTH_CHECK_URL: https://127.0.0.1
        run: node selenium.test.mjs github

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "---- docker compose ps ----"
          docker compose -f compose.yaml -f docker-compose.ci.yml ps
          echo "---- backend logs ----"
          docker compose logs backend
          echo "---- nginx logs ----"
          docker compose logs nginx
          echo "---- frontend logs ----"
          docker compose logs frontend
          echo "---- selenium logs ----"
          docker compose -f compose.yaml -f docker-compose.ci.yml logs selenium

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f docker-compose.ci.yml down -v
  deploy:
      name: Deploy to AWS VM
      runs-on: ubuntu-latest
      needs: [integration-tests]
      if: github.ref == 'refs/heads/Development' && github.event_name == 'push'
      steps:
        - name: SSH deploy to AWS EC2
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              cd ~/ict2216-safesplit
              git pull origin main
              docker compose up --build -d
              docker compose ps
